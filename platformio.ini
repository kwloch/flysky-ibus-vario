[platformio]
default_envs = esp32-c6-zero

[env]
framework = arduino
monitor_speed = 115200
; Korekcja temperaturowa wysokości (temperatura odniesienia z okna startowego).
; Domyślnie włączona; do porównania ustaw 0.
build_flags = -DVARIO_TEMPERATURE_CORRECTION=1

[env:esp32-c6-zero]
platform = espressif32@8.0.0
board = waveshare_esp32_c6_zero
board_upload.flash_size = 8MB
; Oficjalne IBusBM 1.1.4 nie kompiluje się z Arduino core 3.x.
; Pin poprawki z PR bmellink/IBusBM#51 (timer API).
lib_deps =
    https://github.com/AndersV209/IBusBM.git#bf884721aa91e08e002439fe2cc7946bd82ee4b6

[env:nrf52840]
; Board prowizoryczny — zmienić po identyfikacji modułu i bootloadera.
platform = nordicnrf52@11.0.0
board = adafruit_feather_nrf52840

[env:native]
platform = native
framework =
test_framework = unity
test_build_src = no
